apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd

resources:
  - https://github.com/argoproj-labs/argocd-image-updater/config/default?ref=stable
  - image-updater.yaml

patches:
  - target:
      kind: ConfigMap
      name: argocd-image-updater-config
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-image-updater-config
      data:
        interval: 2m
        log.level: info
