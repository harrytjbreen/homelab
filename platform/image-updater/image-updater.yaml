apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: homelab-latest-images
  namespace: argocd
spec:
  writeBackConfig:
    method: argocd
  applicationRefs:
    - namePattern: ping-api
      images:
        - alias: pingapi
          imageName: ghcr.io/harrytjbreen/ping-api:latest
          commonUpdateSettings:
            updateStrategy: digest
          manifestTargets:
            kustomize:
              name: ghcr.io/harrytjbreen/ping-api
    - namePattern: spotify
      images:
        - alias: spotify
          imageName: ghcr.io/harrytjbreen/spotify:latest
          commonUpdateSettings:
            updateStrategy: digest
          manifestTargets:
            kustomize:
              name: ghcr.io/harrytjbreen/spotify
