apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ping-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/harrytjbreen/homelab.git
    targetRevision: main
    path: apps/ping-api/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: ping-api
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
